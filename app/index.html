<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#101114" />
    <meta name="description" content="Every pixel is a true pixel. Turn AI-generated or handmade images into real pixel art at the exact size you choose, with a clean palette and no generative AI needed." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Cpath fill='%23f5a623' d='M0 0h2v2H0zM2 2h2v2H2z'/%3E%3Cpath fill='%23d4692a' d='M2 0h2v2H2zM0 2h2v2H0z'/%3E%3C/svg%3E" />
    <title>Pixilate</title>
    <script>
      // Pre-paint theme from the system (GlassKit defaults to dark and does not read the preference).
      ;(() => {
        const q = matchMedia('(prefers-color-scheme: light)')
        const set = () => {
          document.documentElement.dataset.theme = q.matches ? 'light' : 'dark'
          document.querySelector('meta[name=theme-color]').content = q.matches ? '#f2f3f5' : '#101114'
        }
        set()
        q.addEventListener('change', set)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
